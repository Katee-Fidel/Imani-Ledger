name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tests/integration/*.test.js spin up an in-memory MongoDB replica set
      # via mongodb-memory-server — no DB service container or secrets needed
      # for CI. The server downloads its own MongoDB binary on first use;
      # caching it here is what keeps repeat runs fast and avoids flakiness
      # from re-downloading it on every push.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('backend/package-lock.json') }}

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

  build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No build step for a plain Node/Express API — this just confirms the
      # entry point and every route/service/model file actually parses and
      # loads (catches a bad require or syntax error CI would otherwise miss
      # since there's no separate "build" command to run it through).
      - name: Verify the app boots without a database
        run: node -e "require('./src/app.js'); console.log('app.js loaded OK')"
